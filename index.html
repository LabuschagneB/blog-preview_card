<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Mentor | Blog preview card</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
    <meta name="description" content="Blog Preview Card">
    <link rel="preload" href="css/custom.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="css/custom.css"></noscript>
</head>
<body>

    <main class="blog-preview-container border-gray-950 border-radius-18px p-24">
        <img src="assets/images/illustration-article.svg" class="img-responsive border-radius-18px mb-20" alt="illustration article" loading="lazy">
        <article>
            <h1 class="label">Learning</h1>
            <p>Published <time datetime="2023-12-21">21 December 2023</time></p>
            <h2 class="post-heading">HTML &amp; CSS foundations</h2>
            <p class="light-gray lh-22">These languages are the backbone of every website, defining structure, content, and presentation.</p>
            <p class="avatar"><img src="assets/images/image-avatar.webp" alt="Image avatar"> <strong>Greg Hooper</strong></p>
        </article>
    </main>
    
</body>
</html>
